name: Deploy Lunar Base to GitHub Pages

on:
  push:
    branches:
      - stage/06-mountain-garage-departure
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments to the single GitHub Pages environment.
# Do not cancel an active deployment when another commit is pushed.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
